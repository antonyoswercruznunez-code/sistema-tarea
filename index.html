<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Tareas</title>
</head>
<body>
<h1>Sistema de Registro de Tareas</h1>
<main>
<section id="formulario">

    <h2>Nueva tarea</h2>

    <form id="formTarea">

        <label for="tarea">
            Descripción:
        </label>

        <input 
            type="text" 
            id="tarea" 
            placeholder="Ingrese una tarea" 
            required>

        <button type="submit">
            Registrar
        </button>

    </form>

</section>

<section id="lista-tareas"></section>
</main>
</body>
</html>
